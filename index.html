<script>

	function generateChart( canvas, chartTitle, temperatures, furnaceTime ){
		return new Chart(canvas, 
		{
					type: "line",
					data: {
						//labels: xValues,
						datasets: [
							{
								label: "Outdoor Temperature",
								fill: false,
								lineTension: 0,
								backgroundColor: "rgba(0,0,255,1.0)",
								borderColor: "rgba(0,0,255,0.1)",
								data: temperatures,
								<!--data: [{ x: '2026-02-01', y: 10 },{ x: '2026-02-15', y: 15 },{ x: '2026-02-28', y: 8 }],-->
							},
							{
								label: "Furnace Time",
								fill: false,
								lineTension: 0,
								backgroundColor: "rgba(128,0,128,1.0)",
								borderColor: "rgba(128,0,128,0.1)",
								data: furnaceTime,
								<!--data: [{ x: '2026-02-01', y: 10 },{ x: '2026-02-15', y: 15 },{ x: '2026-02-28', y: 8 }],-->
							}
						]
					},
					options: {
						maintainAspectRatio: true, /*this work*/
						scales: {
							xAxis: {
								type: 'time',   // This triggers the date-fns adapter
								bounds : 'data', // This is the key: it clips the axis to your data range
								time:{
									unit: 'day',   // Forces the x-axis to show days
									displayFormats:{
										day: "yyyy MM d"  // Using date-fns formatting strings
									}
								},
								title: {
									display: true,
									text: "date"
								}
							}
						},
					}
		});
	}
	
</script>
